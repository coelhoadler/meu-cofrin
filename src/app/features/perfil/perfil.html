<div class="max-w-8xl mx-auto py-4 space-y-6">
  <!-- Header -->
  <div>
    <button
      [routerLink]="navigationHistory.previousRoute()"
      class="text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 flex items-center gap-1 text-sm font-medium mb-6 hidden sm:inline-flex"
    >
      <span class="material-symbols-outlined text-[18px]">arrow_back</span>
      Voltar
    </button>
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Meu perfil</h1>
    <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Atualize seus dados e segurança.</p>
  </div>

  <!-- Card 1: Photo -->
  <app-perfil-foto
    [user]="user() ?? null"
    (successMessage)="successMessage.set($event)"
    (errorMessage)="errorMessage.set($event)"
  />

  <!-- Messages Geral -->
  @if (successMessage()) {
    <div class="p-3 bg-emerald-50 text-emerald-700 rounded-xl text-sm flex items-center gap-2">
      <span class="material-symbols-outlined text-emerald-500">check_circle</span>
      {{ successMessage() }}
    </div>
  }
  @if (errorMessage()) {
    <div class="p-3 bg-red-50 text-red-700 rounded-xl text-sm flex items-center gap-2">
      <span class="material-symbols-outlined text-red-500">error</span>
      {{ errorMessage() }}
    </div>
  }

  <!-- Card 2: Personal Info -->
  <app-perfil-dados
    [user]="user() ?? null"
    (successMessage)="successMessage.set($event)"
    (errorMessage)="errorMessage.set($event)"
  />

  <!-- Card 3: Email Notifications -->
  <app-perfil-notificacoes
    [user]="user() ?? null"
    (successMessage)="successMessage.set($event)"
    (errorMessage)="errorMessage.set($event)"
  />

  <!-- Card 4: Biometrics -->
  <app-perfil-seguranca
    [user]="user() ?? null"
    (successMessage)="successMessage.set($event)"
    (errorMessage)="errorMessage.set($event)"
  />

  <!-- Card 5: Danger Zone & Modal -->
  <app-deletar-conta-modal />
</div>
