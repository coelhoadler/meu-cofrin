@if (sessionService.showExpiredModal()) {
<div class="fixed inset-0 z-[99999] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md transition-all duration-300">
  <div
    class="w-full max-w-md bg-white dark:bg-[#1a112c] rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-200/80 dark:border-slate-800/80 text-center relative overflow-hidden transform transition-all">
    <!-- Efeito de brilho decorativo no topo -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-40 h-2 bg-gradient-to-r from-amber-400 via-rose-500 to-indigo-500 rounded-b-full"></div>

    <!-- Ícone de Atenção/Temporizador -->
    <div class="mx-auto w-16 h-16 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200/60 dark:border-amber-700/40 flex items-center justify-center text-amber-600 dark:text-amber-400 mb-5 shadow-inner">
      <span class="material-symbols-outlined text-3xl">hourglass_bottom</span>
    </div>

    <!-- Título -->
    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight">
      Sua sessão expirou
    </h2>

    <!-- Descrição Amigável -->
    <p class="mt-3 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
      Por questões de segurança e proteção dos seus dados, a sua sessão foi encerrada após o limite de tempo configurado.
    </p>

    <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">
      Faça login novamente para continuar acessando seu ambiente com tranquilidade.
    </p>

    <!-- Botão de Redirecionamento para Login -->
    <div class="mt-6 pt-2">
      <button
        type="button"
        (click)="onConfirmLogin()"
        class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold shadow-lg shadow-indigo-500/25 transition-all duration-200 active:scale-[0.98] cursor-pointer flex items-center justify-center gap-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-[#1a112c]">
        <span class="material-symbols-outlined text-lg">login</span>
        Fazer novo login
      </button>
    </div>
  </div>
</div>
}
